# Fallback project generator, for when the checked-in .xcodeproj will not open
# (it is written for Xcode 16's synchronized-folder format). Needs XcodeGen:
#
#   brew install xcodegen
#   cd iPadOS && xcodegen generate
#
name: BigFader
options:
  bundleIdPrefix: com.jonpike
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

targets:
  BigFader:
    type: application
    platform: iOS
    sources:
      - BigFader
    settings:
      base:
        PRODUCT_NAME: Big Fader
        PRODUCT_BUNDLE_IDENTIFIER: com.jonpike.BigFader
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Big Fader
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
